#This value represents MB, e.g 25 means 25MB.
form.attachment.max.size                25
#This value represents KB, e.g 100 means 100KB.
image.upload.max.size                   100
#Set this value to true to reload the Index.groovy class every time a custom page is displayed
custom.page.debug                       false
#Min time (in millis) between two database check of custom pages and REST API extensions last update date
#if the page has been modified in the database it is retrieved locally, but this property is used to avoid doing the database check at each HTTP request
#the value can be increased to improve page or REST API extension loading/response time if live update is not used
custom.page.lastupdate.database.check.interval.milliseconds 3000
#Name of attribute attached to the request to indicate the request id
req.requestId.attributeName             track.requestId
#Name of request header containing the request id when not already attached
req.requestId.headerName                X-Request-ID
#Name of attribute attached to the request to indicate the correlation id
req.correlationId.attributeName         track.correlationId
#Name of request header containing the correlation id when not already attached
req.correlationId.headerName            X-Correlation-ID