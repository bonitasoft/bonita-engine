apply plugin: libs.plugins.taskInfo.get().pluginId

allprojects {
    apply plugin: 'maven-publish'

    group = 'org.bonitasoft.engine'

    tasks.withType(Copy).configureEach {
        setDuplicatesStrategy(DuplicatesStrategy.INCLUDE)
    }

    publishing {
        repositories {
            if (project.hasProperty("altDeploymentRepository")) {
                def repoProperties = project.getProperties()."altDeploymentRepository".split("::")
                maven {
                    name = repoProperties.first()
                    url = repoProperties.last()
                    //those credentials can be given using -P<repo_name>Username and -P<repo_name>Password see README.md
                    credentials(PasswordCredentials)
                }
            }
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'com.adarshr.test-logger'
    apply plugin: 'org.gradle.test-retry'

    repositories {
        mavenCentral()
        if (project.hasProperty("extraRepositories")) {

            def extraRepositories = project.getProperties().get("extraRepositories")
            extraRepositories.split(",").each { repo ->
                def repoProperties = repo.split("::")
                maven {
                    name = repoProperties.first()
                    url = repoProperties.last()
                    //those credentials can be given using -P<repo_name>Username and -P<repo_name>Password see README.md
                    credentials(PasswordCredentials)
                }
            }
        }

        // related to ehcache-core 2.x - must be challenged when upgrading to ehcache 3.x
        // needed to get org.terracotta.internal:statistics:1.0.5 (required by ehcache-core jar)
        maven {
            url 'https://repo.terracotta.org/maven2/'
        }
        maven {
            url "https://central.sonatype.com/repository/maven-snapshots/"
            mavenContent {
                snapshotsOnly()
            }
        }
        mavenLocal()
    }

    dependencies {
        testImplementation libs.junit5api
        testCompileOnly libs.junit4
        testRuntimeOnly libs.junitJupiterEngine
        // to support junit4 tests
        testRuntimeOnly libs.junitVintageEngine
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
    afterEvaluate {
        tasks.withType(AbstractCompile).configureEach { options.encoding = 'UTF-8' }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.fork = true
    }
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
        options.encoding = 'UTF-8'
    }
    tasks.withType(DependencyReportTask).configureEach {
        group "Documentation"
        description "List runtime dependencies for a specified configuration"
        configurations = [project.configurations.runtimeClasspath]
    }

    // Configure all test tasks (test, integrationTest, httpIT, databaseTest)
    tasks.withType(Test).configureEach {
        useJUnitPlatform {
            includeEngines 'junit-jupiter', 'junit-vintage'
        }
        jvmArgs += ['--add-opens', 'java.base/java.util=ALL-UNNAMED', '--add-opens', 'java.base/java.lang=ALL-UNNAMED', '-Dfile.encoding=UTF-8']
        if (!project.hasProperty("createTestReports")) {
            reports.html.required = false
            reports.junitXml.required = false
        }

        retry {
            // Test Retry Plugin Configuration
            // Can be overridden from command line:
            //   -PtestRetryMaxRetries=5       (Gradle property - recommended)
            //   -Dtest.retry.maxRetries=5     (System property)
            //   -PtestRetryMaxFailures=20     (Max failures before stopping)
            //   -Dtest.retry.maxFailures=20   (System property)
            //   -PtestRetryFailOnFlaky=false  (Don't fail on flaky tests)
            //
            // Examples:
            //   ./gradlew integrationTest -PtestRetryMaxRetries=5
            //   ./gradlew iT -PtestRetryMaxRetries=0  # Disable retry
            //   ./gradlew mysqlDatabaseTest -PtestRetryMaxRetries=10

            maxRetries = project.hasProperty('testRetryMaxRetries') ?
                project.property('testRetryMaxRetries').toInteger() :
                System.getProperty('test.retry.maxRetries', '2').toInteger()

            maxFailures = project.hasProperty('testRetryMaxFailures') ?
                project.property('testRetryMaxFailures').toInteger() :
                System.getProperty('test.retry.maxFailures', '6').toInteger()

            if (!System.getenv().containsKey("GITHUB_ACTIONS")) {
                // locally, we want to fail the build on flaky tests passing after retry. On CI, no:
                failOnPassedAfterRetry = project.hasProperty('testRetryFailOnFlaky') ?
                    project.property('testRetryFailOnFlaky').toBoolean() : true
            }
            filter {
                // filter by qualified class name (* matches zero or more of any character)
                includeClasses.add("*IT")
            }
        }
    }
    testlogger {
        showFullStackTraces false
        showCauses true
        showPassed false
        showSkipped true
        showSummary false
    }
}
