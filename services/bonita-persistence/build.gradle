dependencies {
    api libs.commonsLang
    api project(':services:bonita-events')
    api(libs.hibernateCore) {
        exclude(module: "jboss-transaction-api_1.2_spec")
        exclude(group: "javax.activation") //replaced by jakarta
    }
    api libs.jakartaActivation
    api project(':services:bonita-session')
    api project(':services:bonita-commons')
    api project(':services:bonita-lock')
    api libs.slf4jApi

    implementation(libs.jakartaAnnotations)

    compileOnly libs.jakartaTransactionApi

    // jakarta JAXB provider for Hibernate's hbm.xml binding and the engine's jakarta.xml.bind
    // users (organization/profile import-export, BDM): hibernate-core (javax) used to provide the
    // JAXB runtime transitively, its jakarta variant does not resolve one at runtime
    runtimeOnly(libs.jaxbRuntime)
    annotationProcessor libs.lombok
    compileOnly libs.lombok

    testImplementation libs.mockitoCore
    testImplementation libs.assertj
    testImplementation libs.systemRules

    testAnnotationProcessor libs.lombok
    testImplementation libs.lombok

    testRuntimeOnly libs.logback
}
