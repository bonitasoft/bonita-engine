[bundles]
# groovy-servlet removed from the bundle: compiled against javax.servlet, no jakarta variant in
# Groovy 3.x/4.x - breaking change for customers using GroovyServlet/TemplateServlet from the
# runtime classpath (documented in the migration release notes; see ADR-0016 Phase 5)
groovy = ["groovyCore", "groovyXml", "groovyJson", "groovyJmx", "groovyNio", "groovyGroovysh", "groovyDatetime",
    "groovyDateutil", "groovyDocgenerator", "groovyJsr223", "groovySql", "groovyTemplates", "groovyYaml"]

[plugins]
bonitaFormatting = { id = "com.bonitasoft.gradle.bonita-formatting", version = "1.1.0" }
dependencyUpdates = { id = "com.github.ben-manes.versions", version = "0.54.0" } # used by "List out-of-date dependencies" script
taskInfo = { id = "org.barfuin.gradle.taskinfo", version = "3.0.2" } # Adds a 'tiTree' task to display Gradle task-graph
testRetry = { id = "org.gradle.test-retry", version = "1.6.5" } # used to retry flaky tests automatically
