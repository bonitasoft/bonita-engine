[versions]
# The groovy version must be in synch with the bonita-project-parent POM (bonita-project repository):
# Groovy 4 decision (2026-07, see ADR-0016): coordinates moved from org.codehaus.groovy to org.apache.groovy
groovyVersion = "4.0.32"
springVersion = "6.2.19"
springSessionVersion = "3.5.7"
springBootVersion = "3.5.16"
commonsLangVersion = "3.20.0"
bonitaArtifactsModelVersion = "2.0.0"
bonitaSecurityVersion = "1.31.1"
commonsIOVersion = "2.22.0"
commonsFileUpload2Version = "2.0.0-M5"
commonsBeanutilsVersion = "1.11.0"
commonsCollectionsVersion = "4.5.0"
tomcatVersion = "10.1.57"
commonsCLIVersion = "1.11.0"
commonsTextVersion = "1.15.0"
commonsValidatorVersion = "1.10.1"
semver4jVersion = "3.1.0"
slf4jVersion = "2.0.18"
# Attention, see PassingPropertiesJCacheRegionFactory javadoc if this version changes:
hibernateVersion = "5.6.15.Final"
# Bonita's own dependency for BDM proxy generation (business-data modules); NOT pulled by
# Hibernate anymore - hibernate-core(-jakarta) 5.6 uses byte-buddy, javassist was dropped in 5.5:
javassistVersion = "3.29.2-GA"
# jakarta.persistence-api 3.0 is the JPA level implemented by hibernate-core-jakarta 5.6:
jakartaPersistenceApiVersion = "3.0.0"
# JAXB 4 line: forced by bonita-artifacts-model 2.x (conflict resolution upgrades the API to 4.x
# anyway); the 4.0.x runtime binds the hibernate hbm model compiled against 3.0 annotations:
jakartaXmlBindVersion = "4.0.4"
jacksonBomVersion = "2.22.0"
# 2.0.x provides the jakarta.transaction.* namespace (1.3.x shipped javax.transaction.* despite the artifact name):
jakartaTransactionVersion = "2.0.1"
jakartaServletVersion = "6.0.0"
httpComponentsVersion = "4.5.14"
xstreamVersion = "1.4.21"
ehCacheVersion = "3.11.1"
eclipseCompilerVersion = "3.46.0"
jakartaActivationVersion = "2.0.1"
jakartaValidationApiVersion = "3.1.1"
quartzVersion = "2.5.2"
micrometerVersion = "1.16.5"
# DB drivers:
mysqlVersion = "8.4.0"
msSqlServerVersion = "12.10.2.jre11"
oracleVersion = "23.26.2.0.0"
postgresqlVersion = "42.7.13"

narayanaVersion = "5.13.1.Final"
logbackVersion = "1.5.38"
jaxbVersion = "2.3.9"
jakartaAnnotationApiVersion = "2.1.1"
hazelcastVersion = "5.4.0" # Also update http://www.hazelcast.com/schema/config/hazelcast-config-<VERSION>.xsd if needed
jcacheVersion = "1.1.1"
guavaVersion = "33.6.0-jre"
antlr4RuntimeVersion = "4.7.2"
# 4.1.x targets Java 21 bytecode (class file 65); stay on the 4.0.x line while the build toolchain is Java 17
casClientCoreVersion = "4.0.4"
jtidyVersion = "r938"
squigglyFilterJacksonVersion = "1.3.18"
aspectjVersion = "1.9.25.1"

# bonita-web specific dependencies:
jsonSimpleVersion = "1.1.1"
urlrewritefilterVersion = "5.1.3"
xbeanClassloaderVersion = "4.31"
jgettextVersion = "0.15.1"
hamcrestVersion = "3.0"
woodstoxCoreVersion = "7.2.1"
# When updating Keycloak version, if necessary, make sure to update the code in
# subscription/bpm/bonita-web-server-sp package org.bonitasoft.console.common.server.auth.impl
keycloakVersion = "24.0.5"
xmlsecVersion = "2.3.5"
bouncyCastleVersion = "1.85"
spnegoVersion = "1.2.1"
owaspHtmlSanitizerVersion = "20260313.1"

# Test dependency versions
junit4Version = "4.13.2"
junit5Version = "6.1.2"
awaitilityVersion = "4.3.0"
assertjVersion = "3.27.7"
xmlunitVersion = "1.6"
mockitoVersion = "5.23.0"
jsonUnitVersion = "6.0.1"
systemRulesVersion = "1.19.0"
systemLambdaVersion = "1.2.1"
concurrentUnitVersion = "0.4.6"
jettyVersion = "12.0.37"
jbossLoggingVersion = "3.6.3.Final"
jsonassertVersion = "1.5.3"
commonsExecVersion = "1.6.0"
jmockitVersion = "1.50"
mockServerJunitVersion = "7.4.0"


