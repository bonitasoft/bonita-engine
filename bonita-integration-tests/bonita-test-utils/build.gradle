dependencies {
    api project(':bpm:bonita-client')
    api project(':bpm:bonita-common')
    api project(':bonita-test-api')
    api libs.commonsIO
    api libs.xmlunit
    api libs.assertj

    // direct jakarta.xml.bind imports in this module, do not rely on transitive resolution
    implementation libs.jakartaXmlBind
    implementation project(':bpm:bonita-core:bonita-process-engine')
    implementation libs.junit4
    implementation libs.springTest
}

publishing {
    publications {
        mavenJava(MavenPublication) { from project.components.java }
    }
}